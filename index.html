<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Italiano</title>
<meta name="description" content="Flash cards and reference pages for learning Italian: the basics, adjectives and verbs.">
<meta name="theme-color" content="#ececec">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Italiano">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/src/styles/base.css">
<link rel="stylesheet" href="/src/styles/train.css">
</head>
<body>
  <header class="train-header">
    <div class="header-controls">
      <div class="control" id="group">
        <button type="button" class="select-button" id="group-button" aria-haspopup="true" aria-expanded="false" aria-controls="group-menu"></button>
        <div class="menu group-menu" id="group-menu" role="group" aria-label="What to practise" hidden></div>
      </div>
      <div class="control" id="level">
        <button type="button" class="select-button" id="level-button" aria-haspopup="true" aria-expanded="false" aria-controls="level-menu"></button>
        <div class="menu level-menu" id="level-menu" role="group" aria-label="Level" hidden></div>
      </div>
      <a class="icon-button" id="grammar-link" href="are.html" title="Grammar and dictionary" aria-label="Grammar and dictionary">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>
        </svg>
      </a>
    </div>
    <div class="control language-control" id="language">
      <button type="button" class="icon-button flag-button" id="language-button" aria-haspopup="true" aria-expanded="false" aria-controls="language-menu"></button>
      <div class="menu language-menu" id="language-menu" role="group" aria-label="Language" hidden></div>
    </div>
  </header>
  <main class="train">
    <div class="scene" id="scene">
      <div class="card" id="card">
        <div class="face front">
          <div class="heading" id="front-heading"></div>
          <button type="button" class="speak" id="front-speak" title="Say it in Italian" aria-label="Say it in Italian" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>
            </svg>
          </button>
          <div class="word" id="front-word"></div>
        </div>
        <div class="face back">
          <div class="heading" id="back-heading"></div>
          <button type="button" class="speak" id="back-speak" title="Say it in Italian" aria-label="Say it in Italian" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>
            </svg>
          </button>
          <div class="word" id="back-word"></div>
          <div class="rating" id="rating" role="group" aria-label="How well did you know it?">
            <div class="rating-label">How well did you know it?</div>
            <div class="rating-buttons">
              <button type="button" data-rating="1" title="No idea (1)">1</button>
              <button type="button" data-rating="2" title="2">2</button>
              <button type="button" data-rating="3" title="3">3</button>
              <button type="button" data-rating="4" title="4">4</button>
              <button type="button" data-rating="5" title="Knew it perfectly (5)">5</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="progress level-progress" id="level-progress">
      <div class="bar"><div class="fill"></div></div>
      <span class="count"></span>
    </div>
  </main>
  <footer class="progress total-progress" id="total-progress">
    <div class="bar"><div class="fill"></div></div>
    <span class="count"></span>
  </footer>
  <script type="module" src="/src/core/train.js"></script>
</body>
</html>
