<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Italiano</title>
<meta name="description" content="Flash cards and reference pages for learning Italian: the basics, adjectives and verbs.">
<meta name="theme-color" content="#ececec">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Italiano">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/src/base.css">
<link rel="stylesheet" href="/src/train.css">
</head>
<body>
  <header class="train-header">
    <div class="control" id="group">
      <button type="button" class="select-button" id="group-button" aria-haspopup="true" aria-expanded="false" aria-controls="group-menu"></button>
      <div class="menu group-menu" id="group-menu" role="group" aria-label="What to practise" hidden></div>
    </div>
    <div class="control" id="level">
      <button type="button" class="select-button" id="level-button" aria-haspopup="true" aria-expanded="false" aria-controls="level-menu"></button>
      <div class="menu level-menu" id="level-menu" role="group" aria-label="Level" hidden></div>
    </div>
    <a class="icon-button" id="grammar-link" href="are.html" title="Grammar and dictionary" aria-label="Grammar and dictionary">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    </a>
  </header>
  <main class="train">
    <div class="scene" id="scene">
      <div class="card" id="card">
        <div class="face front">
          <div class="heading" id="front-heading"></div>
          <div class="word" id="front-word"></div>
        </div>
        <div class="face back">
          <div class="heading" id="back-heading"></div>
          <div class="word" id="back-word"></div>
          <div class="rating" id="rating" role="group" aria-label="How well did you know it?">
            <div class="rating-label">How well did you know it?</div>
            <div class="rating-buttons">
              <button type="button" data-rating="1" title="No idea (1)">1</button>
              <button type="button" data-rating="2" title="2">2</button>
              <button type="button" data-rating="3" title="3">3</button>
              <button type="button" data-rating="4" title="4">4</button>
              <button type="button" data-rating="5" title="Knew it perfectly (5)">5</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/train.js"></script>
</body>
</html>
