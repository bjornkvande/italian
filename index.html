<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Italiano</title>
<meta name="description" content="Flash cards and reference pages for learning Italian: the basics, adjectives and verbs.">
<meta name="theme-color" content="#ececec">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Italiano">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/src/base.css">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="level" id="level">
    <button type="button" class="level-button" id="level-button" aria-haspopup="true" aria-expanded="false" aria-controls="level-menu"></button>
    <div class="menu level-menu" id="level-menu" role="group" aria-label="Difficulty level" hidden></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <main class="train">
    <div class="scene" id="scene">
      <div class="card" id="card">
        <div class="face front">
          <div class="tense" id="front-tense"></div>
          <div class="word" id="front-word"></div>
        </div>
        <div class="face back">
          <div class="tense" id="back-tense"></div>
          <div class="word" id="back-word"></div>
          <div class="rating" id="rating" role="group" aria-label="How well did you know it?">
            <div class="rating-label">How well did you know it?</div>
            <div class="rating-buttons">
              <button type="button" data-rating="1" title="No idea (1)">1</button>
              <button type="button" data-rating="2" title="2">2</button>
              <button type="button" data-rating="3" title="3">3</button>
              <button type="button" data-rating="4" title="4">4</button>
              <button type="button" data-rating="5" title="Knew it perfectly (5)">5</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
