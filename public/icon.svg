<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The Italian tricolour with wavy edges, like a flag in the wind. -->
  <rect width="512" height="512" fill="#f4f5f0"/>
  <path d="M0 0 H176 C226 128 126 384 176 512 H0 Z" fill="#009246"/>
  <path d="M336 0 H512 V512 H336 C286 384 386 128 336 0 Z" fill="#ce2b37"/>
  <!-- A soft shine across the middle for a bit of depth. -->
  <path d="M0 0 H176 C226 128 126 384 176 512 H0 Z" fill="url(#shade)"/>
  <path d="M336 0 H512 V512 H336 C286 384 386 128 336 0 Z" fill="url(#shade)"/>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
</svg>
